<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f3">
<title>Dryzec Baby Pool</title>
<meta name="description" content="Guess Baby Dryzec's name, size and arrival.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff'/%3E%3Crect y='9' width='32' height='4' fill='%23e9a4b0'/%3E%3Crect y='14' width='32' height='4' fill='%238db5d8'/%3E%3Crect y='19' width='32' height='4' fill='%23e9a4b0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght,SOFT@9..144,500,100&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">The Dryzec Baby Pool</div>
    <h1>Baby Dryzec is on the way</h1>
    <p>Guess the name, the size and the big day. Closest guesses win bragging rights.</p>
    <span class="due" id="due" hidden></span>
  </header>

  <form class="card" id="guessForm" novalidate autocomplete="off">
    <div class="stripe" aria-hidden="true"></div>
    <div class="card-body">
      <div class="hello">
        <label class="label" for="babyName">Hello, my name is</label>
        <input class="hand-input" id="babyName" maxlength="40" placeholder="Baby's name" autocapitalize="words" autocorrect="off" spellcheck="false">
      </div>

      <div class="field">
        <span class="lab" id="gLab">I'm a</span>
        <div class="seg" role="group" aria-labelledby="gLab">
          <button type="button" data-g="girl" aria-pressed="false"><span class="dot" style="background:var(--pink)"></span>Girl</button>
          <button type="button" data-g="boy" aria-pressed="false"><span class="dot" style="background:var(--blue)"></span>Boy</button>
        </div>
      </div>

      <div class="row">
        <div class="field"><label for="bDate">Birthday</label><input class="input" id="bDate" type="date"></div>
        <div class="field"><label for="bTime">Birth time</label><input class="input" id="bTime" type="time"></div>
      </div>

      <div class="row">
        <div class="field"><span class="lab" id="wLab">Weight</span>
          <div class="unit" role="group" aria-labelledby="wLab">
            <input class="input num" id="wLb" inputmode="numeric" pattern="[0-9]*" placeholder="7" aria-label="Pounds"><span>lb</span>
            <input class="input num" id="wOz" inputmode="numeric" pattern="[0-9]*" placeholder="6" aria-label="Ounces"><span>oz</span>
          </div>
        </div>
        <div class="field"><label for="len">Length</label>
          <div class="unit"><input class="input num" id="len" inputmode="decimal" placeholder="19.5"><span>in</span></div>
        </div>
      </div>

      <div class="field by"><label for="guesser">Guessed by</label><input class="input" id="guesser" maxlength="40" placeholder="Your name" autocapitalize="words" autocomplete="name"></div>

      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="submit" type="submit">Submit my guess</button>
      <p class="fine" id="fine">You'll see everyone's guesses after you submit yours.</p>
    </div>
  </form>

  <section class="thanks" id="thanks" hidden>
    <h2>Guess saved</h2>
    <p id="thanksText"></p>
    <button class="link" id="editBtn" type="button">Change my guess</button>
  </section>

  <section id="board" hidden>
    <div class="board-in" style="display:grid;gap:14px">
      <div class="section-h"><h2>Everyone's guesses</h2><span id="count"></span></div>
      <div class="stats" id="stats"></div>
      <div class="guesses" id="guesses"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
